name: Generate Control Client Lock
on:
  push:
    branches: [feature/ui02-control-observe-pwa]
permissions:
  contents: write
jobs:
  lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui02-control-observe-pwa
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: clients/control/package.json
      - name: Generate npm lockfile
        working-directory: clients/control
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/control/package.json clients/control/package-lock.json; then
            echo "lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/control/package.json clients/control/package-lock.json
          git commit -m "client: lock Expo control dependencies"
          git push origin HEAD:feature/ui02-control-observe-pwa
