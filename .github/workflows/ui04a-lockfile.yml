name: Generate UI-04a Mobile Lockfile
on:
  push:
    branches: [feature/ui04a-mobile-foundation]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/ui04a-mobile-foundation
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: clients/control/package-lock.json
      - name: Install existing client dependencies
        working-directory: clients/control
        run: npm ci --ignore-scripts
      - name: Install Expo-compatible SecureStore
        working-directory: clients/control
        run: npx expo install expo-secure-store
      - name: Commit package manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- clients/control/package.json clients/control/package-lock.json; then
            echo "package files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clients/control/package.json clients/control/package-lock.json
          git commit -m "client: add Expo SecureStore dependency"
          git push origin HEAD:feature/ui04a-mobile-foundation
