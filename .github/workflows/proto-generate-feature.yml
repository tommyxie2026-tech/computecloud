name: Generate Proto Feature Branch
on:
  push:
    branches: [feature/agent-control-acp3b-dispatch]
permissions:
  contents: write
jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-control-acp3b-dispatch
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install protobuf compiler and pinned Go generators
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Regenerate protobuf
        run: make generate
      - name: Commit generated protobuf
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- api/agent/v1/runtime.pb.go api/agent/v1/runtime_grpc.pb.go; then
            echo "generated files already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/agent/v1/runtime.pb.go api/agent/v1/runtime_grpc.pb.go
          git commit -m "generate: refresh runtime protobuf for ACP-3b"
          git push origin HEAD:feature/agent-control-acp3b-dispatch
