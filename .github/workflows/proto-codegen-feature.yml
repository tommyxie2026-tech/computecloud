name: Feature Proto Codegen
on:
  push:
    branches:
      - feature/agent-control-roadmap-next
    paths:
      - api/agent/v1/runtime.proto
      - .github/workflows/proto-codegen-feature.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-control-roadmap-next
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install pinned protobuf toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/protoc.zip https://github.com/protocolbuffers/protobuf/releases/download/v35.1/protoc-35.1-linux-x86_64.zip
          unzip -q /tmp/protoc.zip -d /tmp/protoc
          echo "/tmp/protoc/bin" >> "$GITHUB_PATH"
          GOBIN="$HOME/go/bin" go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          GOBIN="$HOME/go/bin" go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$HOME/go/bin" >> "$GITHUB_PATH"
      - name: Generate protobuf bindings
        run: make generate
      - name: Commit generated bindings
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- api/agent/v1/runtime.pb.go api/agent/v1/runtime_grpc.pb.go; then
            echo "generated bindings already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/agent/v1/runtime.pb.go api/agent/v1/runtime_grpc.pb.go
          git commit -m "generate: refresh runtime protobuf bindings"
          git push origin HEAD:feature/agent-control-roadmap-next
