name: ACP3B Proto Codegen

on:
  push:
    branches: [feature/agent-control-acp3b-clean]
    paths:
      - api/agent/v1/runtime.proto
      - .github/workflows/acp3b-proto-codegen.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/agent-control-acp3b-clean
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
      - name: Install pinned Go protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
      - name: Generate protobuf bindings
        run: make generate
      - name: Commit generated bindings and remove temporary workflow
        run: |
          rm .github/workflows/acp3b-proto-codegen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api/agent/v1/runtime.pb.go api/agent/v1/runtime_grpc.pb.go
          git add -u .github/workflows/acp3b-proto-codegen.yml
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 1
          fi
          git commit -m "generated: update ACP-3b protobuf bindings"
          git push origin HEAD:feature/agent-control-acp3b-clean
