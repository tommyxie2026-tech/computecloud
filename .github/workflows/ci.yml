name: Go
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - run: make vet test race smoke capacity-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-capacity
          path: dist/capacity-check-*.json
          if-no-files-found: ignore
