name: Go
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      run_slow:
        description: 'Run long-running, capacity, recovery and multi-arch container gates'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}
jobs:
  certification-simulation:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: python3 scripts/ci_certification_simulation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certification-simulation-${{ github.run_id }}
          path: dist/certification-simulation/
          if-no-files-found: error
          retention-days: 30
  relay-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-relay-contract ci-relay-security-negative ci-relay-direct-fallback ci-relay-restart-recovery ci-relay-flow-control
  v047-stable-gate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: make ci-v047-stable-gate-contract
  transport-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-transport-seam
  control-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-control-review
  goal-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-goal-governance ci-replan-approval-negative
  goal-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-goal-execution
  scheduler-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-scheduler-readiness-contract ci-scheduler-explainability ci-scheduler-readiness-flow
  prepared-workspace-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: make ci-prepared-workspace-cache ci-prepared-workspace-benchmark ci-workspace-job-benchmark
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-cache-${{ github.run_id }}
          path: |
            dist/prepared-workspace-*/
            dist/workspace-job-benchmark/
  verify-macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: go mod download
      - run: go mod verify
      - run: make vet test race smoke ci-flow ci-retry-flow ci-artifact-flow capacity-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-validation-${{ github.run_id }}
          path: dist/
          if-no-files-found: ignore
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - run: make vet test race smoke capacity-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fixture-capacity
          path: dist/capacity-check-*.json
          if-no-files-found: ignore
  task-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Simulate complete task flow
        run: make ci-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-task-flow-${{ github.run_id }}
          path: dist/ci-task-flow
          if-no-files-found: error
          retention-days: 30
  retry-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise bounded Retry Safety flow
        run: make ci-retry-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-retry-flow-${{ github.run_id }}
          path: dist/ci-retry-flow
          if-no-files-found: error
          retention-days: 30
  manual-retry-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise UI-03b manual retry safety contract
        run: make ci-manual-retry-negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-manual-retry-negative-${{ github.run_id }}
          path: dist/ci-manual-retry-negative
          if-no-files-found: error
          retention-days: 30
  artifact-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Artifact Lifecycle flow
        run: make ci-artifact-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-artifact-flow-${{ github.run_id }}
          path: dist/ci-artifact-flow
          if-no-files-found: error
          retention-days: 30
  workspace-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Workspace Lifecycle flow
        run: make ci-workspace-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-workspace-flow-${{ github.run_id }}
          path: dist/ci-workspace-flow
          if-no-files-found: error
          retention-days: 30
  prepared-workspace-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Prepared Workspace core contract
        run: make ci-prepared-workspace-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-prepared-workspace-contract-${{ github.run_id }}
          path: dist/ci-prepared-workspace-contract
          if-no-files-found: error
          retention-days: 30
  prepared-workspace-recovery:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Prepared Workspace recovery invariants
        run: make ci-prepared-workspace-recovery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-prepared-workspace-recovery-${{ github.run_id }}
          path: dist/ci-prepared-workspace-recovery
          if-no-files-found: error
          retention-days: 30
  long-run-flow:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise long-running Job reliability flow
        run: make ci-long-run-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-long-run-flow-${{ github.run_id }}
          path: dist/ci-long-run-flow
          if-no-files-found: error
          retention-days: 30
  fair-flow:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise fair scheduling flow
        run: make ci-fair-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-fair-flow-${{ github.run_id }}
          path: dist/ci-fair-flow
          if-no-files-found: error
          retention-days: 30
  runtime-contract-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Runtime API v2 contract flow
        run: make ci-runtime-contract-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-runtime-contract-${{ github.run_id }}
          path: dist/ci-runtime-contract
          if-no-files-found: error
          retention-days: 30
  runtime-execution-flow:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise transport-neutral Runtime execution flow
        run: make ci-runtime-execution-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-runtime-execution-${{ github.run_id }}
          path: dist/ci-runtime-execution
          if-no-files-found: error
          retention-days: 30
  tool-contract-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise ToolCapability contract flow
        run: make ci-tool-contract-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-tool-contract-${{ github.run_id }}
          path: dist/ci-tool-contract
          if-no-files-found: error
          retention-days: 30
  environment-contract-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise EnvironmentCapability contract flow
        run: make ci-environment-contract-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-environment-contract-${{ github.run_id }}
          path: dist/ci-environment-contract
          if-no-files-found: error
          retention-days: 30
  environment-execution-flow:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise EnvironmentProvider execution flow
        run: make ci-environment-execution-flow
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-environment-execution-${{ github.run_id }}
          path: dist/ci-environment-execution
          if-no-files-found: error
          retention-days: 30
  agent-control-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Validate Agent Control Protocol v1alpha1
        run: make ci-agent-control-schema
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-schema-${{ github.run_id }}
          path: dist/ci-agent-control-schema
          if-no-files-found: error
          retention-days: 30
  agent-control-read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Agent Control read and replay flow
        run: make ci-agent-control-read
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-read-${{ github.run_id }}
          path: dist/ci-agent-control-read
          if-no-files-found: error
          retention-days: 30
  runtime-adapter-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise Runtime Adapter control contract
        run: make ci-runtime-adapter-contract
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-runtime-adapter-contract-${{ github.run_id }}
          path: dist/ci-runtime-adapter-contract
          if-no-files-found: error
          retention-days: 30
  runtime-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: arduino/setup-protoc@v3
        with:
          version: '36.2'
      - name: Install pinned protobuf generators
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: go mod verify
      - name: Exercise Runtime budget enforcement contract
        run: make ci-runtime-budget
        env:
          CI_RUNTIME_BUDGET_OCI: '1'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-runtime-budget-${{ github.run_id }}
          path: dist/ci-runtime-budget
          if-no-files-found: error
          retention-days: 30
  agent-control-fencing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise ACP-3 durable operation and fencing invariants
        run: make ci-agent-control-fencing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-fencing-${{ github.run_id }}
          path: dist/ci-agent-control-fencing
          if-no-files-found: error
          retention-days: 30
  agent-control-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise ACP-3a negative control contracts
        run: make ci-agent-control-negative
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-negative-${{ github.run_id }}
          path: dist/ci-agent-control-negative
          if-no-files-found: error
          retention-days: 30
  agent-control-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise ACP-3b Worker control dispatch and receipt flow
        run: make ci-agent-control-dispatch
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-dispatch-${{ github.run_id }}
          path: dist/ci-agent-control-dispatch
          if-no-files-found: error
          retention-days: 30
  agent-control-approval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise ACP-4a durable approval lifecycle
        run: make ci-agent-control-approval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-approval-${{ github.run_id }}
          path: dist/ci-agent-control-approval
          if-no-files-found: error
          retention-days: 30
  agent-control-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - run: go mod verify
      - name: Exercise ACP-4b current-Attempt session resume
        run: make ci-agent-control-resume
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-agent-control-resume-${{ github.run_id }}
          path: dist/ci-agent-control-resume
          if-no-files-found: error
          retention-days: 30
  control-client-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: clients/control/package-lock.json
      - name: Build and validate C1 Observe client
        run: make ci-control-client-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-client-web-${{ github.run_id }}
          path: |
            dist/control-client-check
            clients/control/dist
          if-no-files-found: error
          retention-days: 30

  control-mobile-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
          cache-dependency-path: clients/control/package-lock.json
      - name: Validate C3 mobile foundation security contract
        run: make ci-control-mobile-check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-mobile-check-${{ github.run_id }}
          path: |
            dist/control-mobile-check
            clients/control/dist-ios
            clients/control/dist-android
          if-no-files-found: error
          retention-days: 30

  control-client-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
      - run: go mod verify
      - name: Exercise C1 Observe against real Server and fixture Worker
        run: make ci-control-client-e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: control-client-e2e-${{ github.run_id }}
          path: dist/control-client-e2e
          if-no-files-found: error
          retention-days: 30

  container-image:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.run_slow)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate minimal multi-arch images
        run: make ci-container-image
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-container-image-${{ github.run_id }}
          path: dist/container/report.json
          if-no-files-found: error
          retention-days: 30

  package:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [relay-fixture, v047-stable-gate-contract, transport-seam, control-review, goal-governance, goal-execution, scheduler-readiness, prepared-workspace-cache, verify-macos, verify, task-flow, retry-flow, manual-retry-negative, artifact-flow, workspace-flow, prepared-workspace-contract, prepared-workspace-recovery, long-run-flow, fair-flow, runtime-contract-flow, runtime-execution-flow, tool-contract-flow, environment-contract-flow, environment-execution-flow, agent-control-schema, agent-control-read, runtime-adapter-contract, runtime-budget, agent-control-fencing, agent-control-negative, agent-control-dispatch, agent-control-approval, agent-control-resume, control-client-check, control-client-e2e, control-mobile-check, container-image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      release: ${{ steps.meta.outputs.release }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: true
      - name: Resolve artifact version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          project_version="$(awk '$1 == "VERSION" && $2 == "?=" { print $3; exit }' Makefile)"
          if [[ ! "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Makefile VERSION is not a semantic version" >&2
            exit 2
          fi
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="$GITHUB_REF_NAME"
            if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
              echo "release tag must be v<semantic-version>" >&2
              exit 2
            fi
            version="${tag#v}"
            if [[ "$version" != "$project_version" ]]; then
              echo "tag version $version does not match Makefile VERSION $project_version" >&2
              exit 2
            fi
            release=true
            release_tag="$tag"
          else
            version="$project_version-dev.${GITHUB_SHA:0:12}"
            release=false
            release_tag=""
            request="release/v${project_version}.json"
            if git rev-parse "$GITHUB_SHA^" >/dev/null 2>&1; then
              changed_files="$(git diff --name-only "$GITHUB_SHA^" "$GITHUB_SHA")"
            else
              changed_files="$(git show --pretty= --name-only "$GITHUB_SHA")"
            fi
            if grep -Fxq "$request" <<<"$changed_files"; then
              requested_version="$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1], encoding="utf-8")); assert set(d) == {"schema_version", "version"}; assert d["schema_version"] == "release-request.v1"; print(d["version"])' "$request")"
              if [[ "$requested_version" != "$project_version" ]]; then
                echo "release request version does not match Makefile VERSION" >&2
                exit 2
              fi
              version="$project_version"
              release=true
              release_tag="v$project_version"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
      - name: Build release archives
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: scripts/package-release.sh "$VERSION" dist/release
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: computecloud-${{ steps.meta.outputs.version }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 30
  container-publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [package, container-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve image tags
        id: tags
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
          RELEASE: ${{ needs.package.outputs.release }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          server="ghcr.io/$owner/computecloud-server"
          worker="ghcr.io/$owner/computecloud-worker"
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "server_tags<<EOF"
            if [[ "$RELEASE" == "true" ]]; then
              echo "$server:$VERSION"
              echo "$server:$RELEASE_TAG"
              if [[ "$VERSION" != *-* ]]; then
                echo "$server:latest"
              fi
            else
              echo "$server:edge"
              echo "$server:sha-$short_sha"
            fi
            echo "EOF"
            echo "worker_tags<<EOF"
            if [[ "$RELEASE" == "true" ]]; then
              echo "$worker:$VERSION"
              echo "$worker:$RELEASE_TAG"
              if [[ "$VERSION" != *-* ]]; then
                echo "$worker:latest"
              fi
            else
              echo "$worker:edge"
              echo "$worker:sha-$short_sha"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Publish server image
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
          IMAGE_TAGS: ${{ steps.tags.outputs.server_tags }}
        run: |
          set -euo pipefail
          mkdir -p dist/container-publish
          mapfile -t tags <<<"$IMAGE_TAGS"
          args=()
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] && args+=(--tag "$tag")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target server \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE=https://github.com/$GITHUB_REPOSITORY" \
            --provenance=mode=max --sbom=true --push \
            --metadata-file dist/container-publish/server.json \
            "${args[@]}" .
      - name: Publish worker image
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
          IMAGE_TAGS: ${{ steps.tags.outputs.worker_tags }}
        run: |
          set -euo pipefail
          mapfile -t tags <<<"$IMAGE_TAGS"
          args=()
          for tag in "${tags[@]}"; do
            [[ -n "$tag" ]] && args+=(--tag "$tag")
          done
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --target worker \
            --build-arg "VERSION=$VERSION" \
            --build-arg "REVISION=$GITHUB_SHA" \
            --build-arg "SOURCE=https://github.com/$GITHUB_REPOSITORY" \
            --provenance=mode=max --sbom=true --push \
            --metadata-file dist/container-publish/worker.json \
            "${args[@]}" .
      - name: Record image digests
        shell: bash
        env:
          VERSION: ${{ needs.package.outputs.version }}
          SERVER_TAGS: ${{ steps.tags.outputs.server_tags }}
          WORKER_TAGS: ${{ steps.tags.outputs.worker_tags }}
        run: |
          set -euo pipefail
          server_digest="$(python3 -c 'import json; print(json.load(open("dist/container-publish/server.json"))["containerimage.digest"])')"
          worker_digest="$(python3 -c 'import json; print(json.load(open("dist/container-publish/worker.json"))["containerimage.digest"])')"
          {
            echo "computecloud container images"
            echo "version=$VERSION"
            echo "source_sha=$GITHUB_SHA"
            echo
            echo "[server]"
            printf '%s\n' "$SERVER_TAGS"
            echo "digest=$server_digest"
            echo
            echo "[worker]"
            printf '%s\n' "$WORKER_TAGS"
            echo "digest=$worker_digest"
          } > dist/container-publish/CONTAINER_IMAGES.txt
      - uses: actions/upload-artifact@v4
        with:
          name: computecloud-container-${{ needs.package.outputs.version }}
          path: dist/container-publish/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: needs.package.outputs.release == 'true'
    needs: [package, container-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download verified archives
        uses: actions/download-artifact@v4
        with:
          name: computecloud-${{ needs.package.outputs.version }}
          path: dist/release
      - name: Download container image metadata
        uses: actions/download-artifact@v4
        with:
          name: computecloud-container-${{ needs.package.outputs.version }}
          path: dist/container-meta
      - name: Add container digests to release assets
        shell: bash
        run: |
          set -euo pipefail
          cp dist/container-meta/CONTAINER_IMAGES.txt dist/release/CONTAINER_IMAGES.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          VERSION: ${{ needs.package.outputs.version }}
          SOURCE_REF: ${{ github.ref }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          options=(--generate-notes --title "computecloud $VERSION")
          if [[ "$VERSION" == *-* ]]; then
            options+=(--prerelease)
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "release $RELEASE_TAG already exists; refusing to overwrite" >&2
            exit 2
          fi
          if [[ "$SOURCE_REF" == refs/tags/* ]]; then
            options+=(--verify-tag)
          else
            options+=(--target "$TARGET_SHA")
          fi
          gh release create "$RELEASE_TAG" dist/release/* "${options[@]}"
